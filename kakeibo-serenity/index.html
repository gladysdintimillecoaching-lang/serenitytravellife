<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kakeibo Serenity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>

/* Layout: a quiet onsen notebook. One sticky-free header, then two columns on wide screens
   (the month's balance drawn as an enso ring on the left, the spending log on the right),
   stacking to one column on a phone. */
:root {
  --bg: #E7ECE8;        /* celadon mist */
  --surface: #F5F7F3;   /* washi */
  --ink: #1F2A3C;       /* aizome indigo ink */
  --muted: #5C6972;
  --line: #C9D3CC;
  --accent: #2F4A6B;    /* indigo */
  --moss: #56744A;      /* matcha */
  --ume: #994C68;       /* plum blossom */
  --kaki: #B85A24;      /* persimmon */
  --hinoki: #B8935C;    /* cypress wood */
  color-scheme: light;
  --display: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", Georgia, serif;
  --body: "Zen Kaku Gothic New", "Hiragino Sans", "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.55; }
.wrap { max-width: 1060px; margin: 0 auto; padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 22px; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; margin: 0; text-wrap: balance; }
h2 { font-size: 1.3rem; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* header */
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand img { height: 48px; width: auto; display: block; border-radius: 6px; }
.mark { width: 44px; height: 44px; flex: none; }
.wordmark { font-family: var(--display); font-size: 1.05rem; letter-spacing: .04em; }
.wordmark small { display: block; font-family: var(--body); font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.tools { display: flex; align-items: center; gap: 8px; }
.ghost { background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; cursor: pointer; font-size: .88rem; }
.ghost:hover { border-color: var(--accent); }
.wave { height: 15px; opacity: .8;
  background-image: radial-gradient(circle at 50% 100%, transparent 0 8px, var(--line) 8px 9px, transparent 9px 12px, var(--line) 12px 13px, transparent 13px);
  background-size: 30px 15px; }

.hero { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px; }
.hero h1 { font-size: clamp(1.9rem, 5vw, 2.7rem); line-height: 1.15; }
.hero h1 span { color: var(--hinoki); font-weight: 500; margin-left: .3em; }
.hero p { color: var(--muted); max-width: 46ch; }
.monthnav { display: flex; align-items: center; gap: 6px; }
.monthnav strong { font-family: var(--display); font-size: 1.15rem; min-width: 10.5ch; text-align: center; text-transform: capitalize; }
.round { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 1.1rem; line-height: 1; }
.round:hover { border-color: var(--accent); }

.note { border: 1px dashed var(--hinoki); border-radius: 10px; padding: 10px 14px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; font-size: .93rem; }

.grid { display: grid; gap: 22px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 880px) { .grid { grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); align-items: start; } }
.col { display: flex; flex-direction: column; gap: 22px; min-width: 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.q { font-size: .74rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }

/* the four questions */
.fields { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: .86rem; color: var(--muted); min-width: 0; }
.in { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; width: 100%; min-width: 0; color: var(--ink); }
textarea.in { min-height: 84px; resize: vertical; }

.balance { display: flex; flex-wrap: wrap; align-items: center; gap: 18px; }
.enso { width: 168px; height: 168px; flex: none; position: relative; }
.enso svg { width: 100%; height: 100%; transform: rotate(-70deg); }
.enso .mid { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 22px; }
.enso .mid b { font-family: var(--display); font-size: 1.35rem; font-variant-numeric: tabular-nums; line-height: 1.2; }
.enso .mid span { font-size: .74rem; color: var(--muted); }
.figs { flex: 1 1 170px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.fig { display: flex; justify-content: space-between; gap: 10px; border-bottom: 1px solid var(--line); padding-bottom: 6px; font-size: .93rem; }
.fig b { font-variant-numeric: tabular-nums; white-space: nowrap; }
.over { color: var(--kaki); font-weight: 700; }

.cats { display: flex; flex-direction: column; gap: 10px; }
.cat { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; font-size: .93rem; }
.cat b { font-variant-numeric: tabular-nums; }
.bar { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 3px; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 7px; }
.c-needs { background: var(--accent); } .c-wants { background: var(--ume); }
.c-culture { background: var(--moss); } .c-extra { background: var(--kaki); }

/* entry form */
.entry { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); }
.entry .wide { grid-column: 1 / -1; }
@media (max-width: 460px) { .entry { grid-template-columns: minmax(0, 1fr); } }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 6px 13px; cursor: pointer; font-size: .9rem; }
.chip[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--bg); }
.chip[aria-pressed="true"] .dot { outline: 1.5px solid var(--bg); }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.btn { background: var(--accent); color: var(--bg); border: 0; border-radius: 999px; padding: 10px 22px; cursor: pointer; font-weight: 700; text-decoration: none; display: inline-block; }
.btn:hover { filter: brightness(1.08); }
.mic { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--accent); color: var(--accent); background: transparent; border-radius: 999px; padding: 8px 16px; cursor: pointer; font-weight: 500; }
.mic i { width: 9px; height: 9px; border-radius: 50%; background: currentColor; }
.mic.on { background: var(--kaki); border-color: var(--kaki); color: var(--bg); }
.mic.on i { animation: pulse 1.1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .mic.on i { animation: none; } }
.hint { font-size: .85rem; color: var(--muted); }
.live { font-style: italic; color: var(--muted); min-height: 1.4em; overflow-wrap: anywhere; }

/* log */
.day { font-size: .78rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-top: 6px; }
.item { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); }
.item .t { overflow-wrap: anywhere; }
.item .t small { display: block; color: var(--muted); font-size: .8rem; }
.item b { font-variant-numeric: tabular-nums; white-space: nowrap; }
.x { border: 0; background: transparent; color: var(--muted); cursor: pointer; font-size: 1.15rem; width: 32px; height: 32px; border-radius: 50%; }
.x:hover { color: var(--kaki); background: var(--bg); }
.empty { color: var(--muted); padding: 8px 0; }

.pause { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 4px; color: var(--muted); font-size: .95rem; }

.coach { background: var(--ink); color: var(--bg); border-radius: 14px; padding: 26px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 26px; align-items: center; }
@media (max-width: 760px) { .coach { grid-template-columns: minmax(0, 1fr); justify-items: start; } }
.who { min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.coach p { opacity: .88; max-width: 60ch; }
.portrait { width: 136px; height: 136px; border-radius: 50%; object-fit: cover; border: 3px solid var(--hinoki); display: block; }
.id { display: flex; flex-direction: column; gap: 1px; font-size: .92rem; border-left: 2px solid var(--hinoki); padding-left: 12px; }
.id b { font-family: var(--display); font-size: 1.1rem; letter-spacing: .03em; }
.id a { color: inherit; }
.qr { margin: 0; background: #F5F7F3; color: #1F2A3C; border-radius: 12px; padding: 10px; width: 156px; display: flex; flex-direction: column; gap: 6px; text-align: center; font-size: .74rem; }
.qr img { width: 100%; height: auto; display: block; }
.coach .btn { background: var(--hinoki); color: var(--ink); }
.coach .btn.alt { background: transparent; color: var(--bg); border: 1px solid var(--bg); }
.coach .price { font-family: var(--display); font-size: 1.1rem; }
[hidden] { display: none !important; }
.foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; font-size: .82rem; color: var(--muted); }


body { margin: 0; }
.notice { margin: 0; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; background: var(--bg); border-radius: 8px; padding: 8px 12px; font-size: .92rem; }
.notice button { background: transparent; border: 1px solid currentColor; color: inherit; border-radius: 999px; padding: 2px 12px; cursor: pointer; }
.btn.line { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
.fields { align-items: end; }
.bk { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>

      if (pct > 0) { doc.setFillColor(...CC[x]); doc.roundedRect(M, y, Math.max(2.4, (W - 2 * M) * pct), 2.4, 1.2, 1.2, "F"); }
      y += 7.5;
    });
    kv(T.savePossible, P(c.possible), true, c.possible >= r.goal ? GRN : KAK);
    doc.setFont("helvetica", "italic"); doc.setFontSize(9.5); doc.setTextColor(...(c.possible >= r.goal ? GRN : KAK));
    need(6); doc.text(pdfTxt(c.possible >= r.goal ? T.goalMet : T.goalMiss), W - M, y - 1.5, { align: "right" }); y += 3;
    sec(T.q4, T.q4k);
    label(T.well); para(r.well || "-");
    label(T.better); para(r.better || "-");
    sec(T.pdfObs, "");
    for (var i = 0; i < 5 && y + 9 <= 282; i++) { doc.setDrawColor(...LN); doc.line(M, y, W - M, y); y += 9; }
    var pages = doc.getNumberOfPages();
    for (var pg = 1; pg <= pages; pg++) {
      doc.setPage(pg); doc.setFont("helvetica", "normal"); doc.setFontSize(8); doc.setTextColor(...MUT);
      doc.text("Gladys Dintimille - Serenity Travel Life - " + CONFIG.phone + (CONFIG.siteUrl ? " - " + CONFIG.siteUrl.replace(/^https?:\/\//, "") : ""), W / 2, 290, { align: "center" });
    }
    return doc.output("blob");
  }
  function saveBlob(blob, filename) {
    var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  }
  function slug(s) { return (s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, ""); }
  $("dlPdf").onclick = function () {
    try {
      var name = $("shName").value.trim().slice(0, 40), sl = slug(name);
      saveBlob(buildPdf(summ(month()), view, name), "bilan-kakeibo-" + (sl ? sl + "-" : "") + view + ".pdf");
      $("shState").textContent = t("pdfSaved");
    } catch (e) { $("shState").textContent = t("pdfFail"); }
  };

  /* ---------- backup ---------- */
  $("exp").onclick = function () {
    if (S.sample) return;
    saveBlob(new Blob([JSON.stringify(S, null, 1)], { type: "application/json" }), "kakeibo-sauvegarde-" + iso(new Date()) + ".json");
    $("bkState").textContent = t("exported");
  };
  $("imp").onclick = function () { $("impFile").click(); };
  $("impFile").onchange = function () {
    var f = this.files && this.files[0]; this.value = ""; if (!f) return;
    var rd = new FileReader();
    rd.onload = function () {
      var o = null; try { o = sanitize(JSON.parse(String(rd.result))); } catch (e) {}
      if (!o) { $("bkState").textContent = t("importFail"); return; }
      S = o; view = ym(new Date()); save(); applyLang(); fillInputs(); render(); $("bkState").textContent = t("imported");
    };
    rd.readAsText(f);
  };

  /* ---------- events ---------- */
  function shift(n) { var p = view.split("-"), d = new Date(+p[0], +p[1] - 1 + n, 1); view = ym(d); fillInputs(); render(); }
  $("prev").onclick = function () { shift(-1); }; $("next").onclick = function () { shift(1); };
  $("lang").onclick = function () { S.lang = S.lang === "fr" ? "en" : "fr"; applyLang(); render(); save(); };
  $("cur").onchange = function () { S.cur = this.value; render(); save(); };
  $("startOwn").onclick = function () { S = blank(S.lang, S.cur); fillInputs(); render(); save(); };
  [["income", "income"], ["fixed", "fixed"], ["goal", "goal"]].forEach(function (p) {
    $(p[0]).addEventListener("input", function () { month(true)[p[1]] = num(this.value); render(); save(); });
  });
  [["n-well", "well"], ["n-better", "better"]].forEach(function (p) {
    $(p[0]).addEventListener("change", function () { month(true)[p[1]] = this.value.slice(0, 4000); renderSend(); save(); });
  });
  $("shName").addEventListener("input", function () { S.name = this.value.trim().slice(0, 40); renderSend(); save(); });
  $("chips").addEventListener("click", function (ev) { var b = ev.target.closest(".chip"); if (b) { cat = b.dataset.c; applyLang(); } });
  $("form").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var a = num($("amt").value), d = $("date").value;
    if (!a || !DAY.test(d)) { $("amt").focus(); return; }
    view = d.slice(0, 7);
    month(true).entries.push({ id: rid(), d: d, a: a, c: cat, t: $("desc").value.trim().slice(0, 120) });
    $("amt").value = ""; $("desc").value = ""; $("live").textContent = "";
    fillInputs(); $("date").value = d; render(); save(); $("amt").focus();
  });
  $("list").addEventListener("click", function (ev) {
    var b = ev.target.closest("[data-del]"); if (!b) return;
    var m = month(true), i = m.entries.findIndex(function (e) { return e.id === b.dataset.del; });
    if (i < 0) return;
    lastDeleted = { ym: view, e: m.entries.splice(i, 1)[0] }; render(); save(); notice(t("deleted"), true);
  });
  $("undo").onclick = function () {
    if (!lastDeleted) return;
    view = lastDeleted.ym; month(true).entries.push(lastDeleted.e); lastDeleted = null; $("notice").hidden = true; fillInputs(); render(); save();
  };

  /* ---------- coach block, embedding ---------- */
  function coachBlock() {
    if (CONFIG.bookingUrl) { $("coachLink").hidden = false; $("coachLink").href = CONFIG.bookingUrl; }
    if (CONFIG.siteUrl) { $("siteLink").hidden = false; $("siteLink").href = CONFIG.siteUrl; }
    var ph = $("phone");
    if (CONFIG.phoneIntl) { var a = document.createElement("a"); a.href = "tel:" + CONFIG.phoneIntl; a.textContent = CONFIG.phone; ph.appendChild(a); } else ph.textContent = CONFIG.phone;
  }
  function postHeight() {
    try { if (window.parent !== window) window.parent.postMessage({ type: "kakeibo-height", height: document.documentElement.scrollHeight }, "*"); } catch (e) {}
  }
  if (window.ResizeObserver) new ResizeObserver(postHeight).observe(document.body);
  window.addEventListener("load", postHeight);

  /* ---------- start ---------- */
  S = loadLocal() || sample();
  view = ym(new Date());
  if (S.sample && !S.months[view]) view = Object.keys(S.months)[0];
  applyLang(); fillInputs(); coachBlock(); render();
  window.__parseSpeech = parseSpeech;
})();
